    function App() {
            const [theme, setTheme] = useState(() => localStorage.getItem('sombra_enxoval_theme') || 'dark');

      useEffect(() => {
        localStorage.setItem('sombra_enxoval_theme', theme);
        if (theme === 'light') {
          document.documentElement.classList.add('light');
          document.body.classList.add('light');
          document.documentElement.classList.remove('dark');
          document.body.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          document.body.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.body.classList.remove('light');
        }
      }, [theme]);
      const [ambiente, setAmbiente] = useState(() => localStorage.getItem('sombra_enxoval_ambiente') || 'hotel');
      const ambienteNome = ambiente === 'hotel' ? 'Hotel & Resort' : 'Floresta & SPA';
      const [activeTab, setActiveTab] = useState('estoque');
      
      // Default view is 'resumida' (grouped / summarized view)
      const [viewModeEmUso, setViewModeEmUso] = useState(() => localStorage.getItem('sombra_enxoval_view_mode') || 'resumida');

      const [items, setItems] = useState(() => {
        try {
          const saved = localStorage.getItem(DB_KEY_ITEMS);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return {
          hotel: INITIAL_RAW_DATA.hotel_items || [],
          spa: INITIAL_RAW_DATA.spa_items || []
        };
      });

      const [locations, setLocations] = useState(() => {
        try {
          const saved = localStorage.getItem(DB_KEY_LOCATIONS);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return DEFAULT_LOCATIONS;
      });

      const [movimentos, setMovimentos] = useState(() => {
        try {
          const saved = localStorage.getItem(DB_KEY_MOVIMENTOS);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return INITIAL_RAW_DATA.initial_movimentos || [];
      });

      const [inventarios, setInventarios] = useState(() => {
        try {
          const saved = localStorage.getItem(DB_KEY_INVENTARIOS);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return INITIAL_RAW_DATA.initial_inventarios || [];
      });

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Todos');
      const [toastMessage, setToastMessage] = useState(null);
      
      const [showMovimentoModal, setShowMovimentoModal] = useState(false);
      const [movimentoTipo, setMovimentoTipo] = useState('COMPRA');
      const [selectedItemForMov, setSelectedItemForMov] = useState('');
      const [editingMovimento, setEditingMovimento] = useState(null);
      const [viewingInventario, setViewingInventario] = useState(null);
      const [activeKpiModal, setActiveKpiModal] = useState(null);
      const [showManualModal, setShowManualModal] = useState(false);
      const [importModalData, setImportModalData] = useState(null);
      const excelImportInputRef = useRef(null);
      const [movFiltroTipo, setMovFiltroTipo] = useState('ALL');
      const [movFiltroItem, setMovFiltroItem] = useState('ALL');
      const [movSortOrder, setMovSortOrder] = useState('desc');
      
      const [showItemModal, setShowItemModal] = useState(false);
      const [editingItem, setEditingItem] = useState(null);

      const [showLocationModal, setShowLocationModal] = useState(false);
      const [editingLocation, setEditingLocation] = useState(null);

      const [isDirectEditMode, setIsDirectEditMode] = useState(false);
      const [unsavedEdits, setUnsavedEdits] = useState({});

      const showToast = useCallback((msg, type = 'success') => {
        setToastMessage({ msg, type });
        setTimeout(() => setToastMessage(null), 3500);
      }, []);

      useEffect(() => {
        localStorage.setItem(DB_KEY_ITEMS, JSON.stringify(items));
        localStorage.setItem('sombra_enxoval_ambiente', ambiente);
      }, [items, ambiente]);

      useEffect(() => {
        localStorage.setItem(DB_KEY_LOCATIONS, JSON.stringify(locations));
      }, [locations]);

      useEffect(() => {
        localStorage.setItem(DB_KEY_MOVIMENTOS, JSON.stringify(movimentos));
      }, [movimentos]);

      useEffect(() => {
        localStorage.setItem(DB_KEY_INVENTARIOS, JSON.stringify(inventarios));
      }, [inventarios]);

      useEffect(() => {
        localStorage.setItem('sombra_enxoval_view_mode', viewModeEmUso);
      }, [viewModeEmUso]);

      const currentItems = useMemo(() => {
        return items[ambiente] || [];
      }, [items, ambiente]);

      // All locations active
      const allActiveLocations = useMemo(() => {
        return (locations[ambiente] || []).filter(l => l.ativo !== false);
      }, [locations, ambiente]);

      // Em Uso Locations (Unidades + Circulação - everything except Almoxarifado Central)
      const emUsoLocations = useMemo(() => {
        return allActiveLocations.filter(loc => loc.tipo !== 'almoxarifado');
      }, [allActiveLocations]);

      // Almoxarifado Location
      const almoxarifadoLocation = useMemo(() => {
        return allActiveLocations.find(loc => loc.tipo === 'almoxarifado') || { id: 'almoxarifado', nome: 'Almoxarifado Central' };
      }, [allActiveLocations]);

      // Categories list for dropdown
      const categories = useMemo(() => {
        const set = new Set();
        currentItems.forEach(it => {
          if (it.categoria) set.add(it.categoria);
        });
        return Array.from(set).sort();
      }, [currentItems]);

      const filteredItems = useMemo(() => {
        return currentItems.filter(item => {
          const matchCat = selectedCategory === 'Todos' || selectedCategory === 'Todas' || item.categoria === selectedCategory;
          const matchSearch = !searchQuery || item.nome.toLowerCase().includes(searchQuery.toLowerCase()) || (item.categoria && item.categoria.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchCat && matchSearch;
        });
      }, [currentItems, selectedCategory, searchQuery]);

      const stats = useMemo(() => {
        let totalEmUso = 0;
        let totalAlmoxarifado = 0;
        let totalGeral = 0;
        let totalDescarte = 0;
        let totalPerda = 0;
        let totalMeta = 0;
        let itensAbaixoMeta = 0;

        currentItems.forEach(item => {
          const saldos = item.saldos || {};
          let emUsoItem = 0;
          let almoxItem = saldos.almoxarifado || 0;
          let descarteItem = saldos.descarte || 0;
          let perdaItem = saldos.perda || 0;

          emUsoLocations.forEach(loc => {
            emUsoItem += (saldos[loc.id] || 0);
          });

          const itemTotalGeral = emUsoItem + almoxItem;
          totalEmUso += emUsoItem;
          totalAlmoxarifado += almoxItem;
          totalGeral += itemTotalGeral;
          totalDescarte += descarteItem;
          totalPerda += perdaItem;
          totalMeta += (item.metaMudas || 0);

          if (item.metaMudas > 0 && itemTotalGeral < item.metaMudas) {
            itensAbaixoMeta++;
          }
        });

        return {
          totalEmUso,
          totalAlmoxarifado,
          totalGeral,
          totalDescarte,
          totalPerda,
          totalMeta,
          itensAbaixoMeta
        };
      }, [currentItems, emUsoLocations]);

            // REGRA DE PROTEÇÃO DE UNIDADES E LOCAIS ESTRUTURAIS
      const isProtectedLocation = (locId, currentAmbiente) => {
        if (currentAmbiente === 'hotel') {
          // Hotel & Resort: Resort, Hotel, Villas, Rouparia Principal, Almoxarifado Central
          return ['resort', 'hotel', 'villas', 'rouparia', 'almoxarifado'].includes(locId);
        }
        if (currentAmbiente === 'spa') {
          // Floresta & SPA: Hotel Floresta (spa), Yeu SPA (yeu), Rouparia Principal (rouparia), Almoxarifado Central (almoxarifado)
          return ['spa', 'yeu', 'rouparia', 'almoxarifado'].includes(locId);
        }
        return false;
      };

      // REGRA DE DESTINO PARA REATRIBUIÇÃO AUTOMÁTICA DE SALDO AO EXCLUIR LOCAL
      const getReallocationTarget = (locToDelete, currentAmbiente) => {
        if (currentAmbiente === 'hotel') {
          if (locToDelete.tipo === 'unidade') {
            return { id: 'hotel', nome: 'Hotel' };
          }
          // Para 'circulacao' ou outros locais
          return { id: 'rouparia', nome: 'Rouparia Principal' };
        } else {
          // Floresta & SPA
          if (locToDelete.tipo === 'unidade') {
            return { id: 'spa', nome: 'Hotel Floresta' };
          }
          // Para 'circulacao' ou outros locais
          return { id: 'rouparia', nome: 'Rouparia Principal' };
        }
      };

      // HANDLER: EXCLUSÃO SEGURA DE LOCAL COM TRANSFERÊNCIA AUTOMÁTICA DE PEÇAS
      const handleDeleteLocation = (locToDelete) => {
        if (isProtectedLocation(locToDelete.id, ambiente)) {
          alert(`O local "${locToDelete.nome}" é uma unidade estrutural obrigatória do sistema e não pode ser excluído.`);
          return;
        }

        const target = getReallocationTarget(locToDelete, ambiente);
        const currentItemList = items[ambiente] || [];

        // Calcular total de peças a serem realocadas
        let totalTransferido = 0;
        currentItemList.forEach(item => {
          const val = item.saldos?.[locToDelete.id] || 0;
          if (val > 0) totalTransferido += val;
        });

        const confirmMsg = totalTransferido > 0
          ? `Tem certeza que deseja excluir o local "${locToDelete.nome}"?\n\n` +
            `📦 REATRIBUIÇÃO AUTOMÁTICA DE SALDO:\n` +
            `Existem ${totalTransferido} peças de enxoval alocadas neste local.\n` +
            `Todos os saldos serão transferidos automaticamente para "${target.nome}" para garantir a integridade total dos dados e do histórico.\n\n` +
            `Deseja confirmar a exclusão e transferência?`
          : `Tem certeza que deseja excluir o local "${locToDelete.nome}"?`;

        if (!confirm(confirmMsg)) return;

        // 1. Atualizar saldos dos itens (realoque para o destino)
        const updatedItemsList = currentItemList.map(item => {
          const saldos = { ...(item.saldos || {}) };
          const val = saldos[locToDelete.id] || 0;
          if (val > 0) {
            saldos[target.id] = (saldos[target.id] || 0) + val;
          }
          delete saldos[locToDelete.id];
          return { ...item, saldos };
        });

        const newItemsState = { ...items, [ambiente]: updatedItemsList };
        setItems(newItemsState);
        localStorage.setItem(DB_KEY_ITEMS, JSON.stringify(newItemsState));

        // 2. Remover local da lista de locais
        const currentLocList = locations[ambiente] || [];
        const updatedLocList = currentLocList.filter(l => l.id !== locToDelete.id);
        const newLocationsState = { ...locations, [ambiente]: updatedLocList };
        setLocations(newLocationsState);
        localStorage.setItem(DB_KEY_LOCATIONS, JSON.stringify(newLocationsState));

        if (totalTransferido > 0) {
          showToast(`Local "${locToDelete.nome}" excluído. ${totalTransferido} peças transferidas para "${target.nome}".`);
        } else {
          showToast(`Local "${locToDelete.nome}" removido com sucesso.`);
        }
      };

      const handleCellChange = (itemId, locationId, value) => {
        setUnsavedEdits(prev => ({
          ...prev,
          [`${itemId}_${locationId}`]: value
        }));
      };

      const handleCellBlur = (itemId, locationId) => {
        const key = `${itemId}_${locationId}`;
        if (unsavedEdits[key] === undefined) return;
        
        const evaluated = evaluateMathExpression(unsavedEdits[key]);
        
        setItems(prev => {
          const list = [...(prev[ambiente] || [])];
          const idx = list.findIndex(it => it.id === itemId);
          if (idx !== -1) {
            const item = { ...list[idx], saldos: { ...(list[idx].saldos || {}) } };
            if (locationId === 'metaMudas') {
              item.metaMudas = evaluated;
            } else {
              item.saldos[locationId] = evaluated;
            }
            list[idx] = item;
          }
          return { ...prev, [ambiente]: list };
        });

        setUnsavedEdits(prev => {
          const copy = { ...prev };
          delete copy[key];
          return copy;
        });
      };

      // Helper to apply or revert movement delta on item's saldos (+1 apply, -1 revert)
      const applyDeltaToItemSaldos = (saldos, movData, factor = 1) => {
        const { tipo, quantidade, origem, destino } = movData;
        const q = typeof quantidade === 'number' ? quantidade : evaluateMathExpression(quantidade);
        if (q <= 0) return;

        const delta = factor * q;

        if (tipo === 'COMPRA') {
          saldos.almoxarifado = Math.max(0, (saldos.almoxarifado || 0) + delta);
        } else if (tipo === 'ABASTECIMENTO') {
          if (origem) saldos[origem] = Math.max(0, (saldos[origem] || 0) - delta);
          if (destino) saldos[destino] = Math.max(0, (saldos[destino] || 0) + delta);
        } else if (tipo === 'ENVIO_LAVANDERIA') {
          saldos.suja = Math.max(0, (saldos.suja || 0) - delta);
          saldos.lavanderia = Math.max(0, (saldos.lavanderia || 0) + delta);
        } else if (tipo === 'RETORNO_LAVANDERIA') {
          saldos.lavanderia = Math.max(0, (saldos.lavanderia || 0) - delta);
          const targetLoc = destino || 'chegouEnsacada';
          saldos[targetLoc] = Math.max(0, (saldos[targetLoc] || 0) + delta);
        } else if (tipo === 'DESCARTE') {
          if (origem) saldos[origem] = Math.max(0, (saldos[origem] || 0) - delta);
          saldos.descarte = Math.max(0, (saldos.descarte || 0) + delta);
        } else if (tipo === 'PERDA') {
          if (origem) saldos[origem] = Math.max(0, (saldos[origem] || 0) - delta);
          saldos.perda = Math.max(0, (saldos.perda || 0) + delta);
        }
      };

      const filteredMovimentos = useMemo(() => {
        let list = movimentos.filter(m => m.ambiente === ambiente);
        if (movFiltroTipo && movFiltroTipo !== 'ALL') {
          list = list.filter(m => m.tipo === movFiltroTipo);
        }
        if (movFiltroItem && movFiltroItem !== 'ALL') {
          list = list.filter(m => m.itemId === movFiltroItem || m.itemNome === movFiltroItem);
        }
        return [...list].sort((a, b) => {
          const da = a.data || a.timestamp || '';
          const db = b.data || b.timestamp || '';
          if (movSortOrder === 'asc') {
            return da.localeCompare(db) || (a.id || '').localeCompare(b.id || '');
          } else {
            return db.localeCompare(da) || (b.id || '').localeCompare(a.id || '');
          }
        });
      }, [movimentos, ambiente, movFiltroTipo, movFiltroItem, movSortOrder]);

      const handleExportMovimentosExcel = () => {
        if (filteredMovimentos.length === 0) {
          alert('Nenhuma movimentação para exportar com os filtros selecionados.');
          return;
        }
        const headers = ['Data', 'Tipo', 'Item', 'Quantidade', 'Origem', 'Destino', 'Motivo / Justificativa', 'Responsável', 'Observações'];
        const rows = [
          headers,
          ...filteredMovimentos.map(m => [
            m.data || '',
            m.tipo || '',
            m.itemNome || '',
            m.quantidade || 0,
            m.origem || '',
            m.destino || '',
            m.motivo || '',
            m.responsavel || '',
            m.observacao || ''
          ])
        ];
        const ws = XLSX.utils.aoa_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Movimentações');
        const filename = `Movimentacoes_Enxoval_${ambiente.toUpperCase()}_${new Date().toISOString().split('T')[0]}.xlsx`;
        XLSX.writeFile(wb, filename);
        showToast('Planilha Excel de Movimentações baixada com sucesso!');
      };

      const handleExportMovimentosPDF = () => {
        try {
          if (filteredMovimentos.length === 0) {
            alert('Nenhuma movimentação para exportar com os filtros selecionados.');
            return;
          }
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

          doc.setFontSize(13);
          doc.text(`GRUPO SOMBRA – HISTÓRICO DE MOVIMENTAÇÕES (${ambiente.toUpperCase()})`, 14, 12);
          doc.setFontSize(8.5);
          const tipoLabel = movFiltroTipo === 'ALL' ? 'Todos' : movFiltroTipo;
          const itemLabel = movFiltroItem === 'ALL' ? 'Todos' : (currentItems.find(it => it.id === movFiltroItem)?.nome || movFiltroItem);
          const ordemLabel = movSortOrder === 'desc' ? 'Mais recentes primeiro' : 'Mais antigos primeiro';
          const subheader = `Filtros: Tipo [${tipoLabel}] | Item [${itemLabel}] | Ordem: ${ordemLabel} | Total: ${filteredMovimentos.length} registros | Emissão: ${new Date().toLocaleDateString('pt-BR')} ${new Date().toLocaleTimeString('pt-BR')}`;
          doc.text(subheader, 14, 17);

          const tableHeaders = ['DATA', 'TIPO', 'ITEM', 'QTD', 'ORIGEM -> DESTINO', 'MOTIVO / OBS', 'RESPONSÁVEL'];

          const tableRows = filteredMovimentos.map(m => [
            m.data || '',
            m.tipo || '',
            m.itemNome || '',
            String(m.quantidade || 0),
            `${m.origem || '-'} -> ${m.destino || '-'}`,
            `${m.motivo ? '[' + m.motivo + '] ' : ''}${m.observacao || '-'}`,
            m.responsavel || '-'
          ]);

          doc.autoTable({
            head: [tableHeaders],
            body: tableRows,
            startY: 21,
            styles: { fontSize: 8, cellPadding: 2 },
            headStyles: { fillColor: [15, 23, 42], textColor: [255, 255, 255] },
            alternateRowStyles: { fillColor: [248, 250, 252] },
            margin: { top: 21, left: 14, right: 14, bottom: 14 }
          });

          const filename = `Movimentacoes_Enxoval_${ambiente.toUpperCase()}_${new Date().toISOString().split('T')[0]}.pdf`;
          doc.save(filename);
          showToast(`PDF de Movimentações gerado: ${filename}`);
        } catch (err) {
          console.error(err);
          alert('Erro ao gerar PDF: ' + err.message);
        }
      };

      const handleSaveMovimento = (formData) => {
        const { tipo, itemId, quantidade, origem, destino, motivo, responsavel, observacao, data } = formData;
        const q = evaluateMathExpression(quantidade);
        if (q <= 0) {
          alert('Por favor insira uma quantidade válida maior que zero.');
          return;
        }

        const item = currentItems.find(it => it.id === itemId);
        if (!item) {
          alert('Item não encontrado.');
          return;
        }

        if (editingMovimento) {
          // Confirm edit
          const isConfirmed = confirm(
            `Confirmar a ALTERAÇÃO desta movimentação?

` +
            `• Registro anterior: ${editingMovimento.tipo} de ${editingMovimento.quantidade} UN (${editingMovimento.itemNome})
` +
            `• Novo registro: ${tipo} de ${q} UN (${item.nome})
` +
            `• Data: ${data || editingMovimento.data}
` +
            `• Responsável: ${responsavel || 'Governança'}

` +
            `Os saldos do estoque serão recalculados automaticamente.`
          );
          if (!isConfirmed) return;

          // Revert old & apply new
          setItems(prev => {
            const list = [...(prev[ambiente] || [])];
            
            // Revert old
            const oldIdx = list.findIndex(it => it.id === editingMovimento.itemId);
            if (oldIdx !== -1) {
              const oldClone = { ...list[oldIdx], saldos: { ...(list[oldIdx].saldos || {}) } };
              applyDeltaToItemSaldos(oldClone.saldos, editingMovimento, -1);
              list[oldIdx] = oldClone;
            }

            // Apply new
            const newIdx = list.findIndex(it => it.id === itemId);
            if (newIdx !== -1) {
              const newClone = { ...list[newIdx], saldos: { ...(list[newIdx].saldos || {}) } };
              applyDeltaToItemSaldos(newClone.saldos, { ...formData, quantidade: q }, +1);
              list[newIdx] = newClone;
            }

            return { ...prev, [ambiente]: list };
          });

          setMovimentos(prev => prev.map(m => {
            if (m.id === editingMovimento.id) {
              return {
                ...m,

      const handleExcelFileSelected = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            // Choose the best sheet: look for matching ambient name or first sheet
            let sheetName = workbook.SheetNames[0];
            for (const s of workbook.SheetNames) {
              const lower = s.toLowerCase();
              if (ambiente === 'hotel' && (lower.includes('hotel') || lower.includes('resort'))) {
                sheetName = s;
                break;
              }
              if (ambiente === 'spa' && (lower.includes('spa') || lower.includes('floresta') || lower.includes('restaurante'))) {
                sheetName = s;
                break;
              }
            }

            const worksheet = workbook.Sheets[sheetName];
            const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

            if (!rawRows || rawRows.length < 2) {
              alert('A planilha selecionada está vazia ou não possui cabeçalhos válidos.');
              return;
            }

            // Find header row (the row containing 'ITEM' or 'PRODUTO' or first column)
            let headerRowIdx = 0;
            for (let r = 0; r < Math.min(10, rawRows.length); r++) {
              const rowStr = rawRows[r].map(c => String(c).trim().toUpperCase()).join(' ');
              if (rowStr.includes('ITEM') || rowStr.includes('CATEGORIA') || rowStr.includes('TOTAL')) {
                headerRowIdx = r;
                break;
              }
            }

            const headers = rawRows[headerRowIdx].map(c => String(c).trim());
            const dataRows = rawRows.slice(headerRowIdx + 1);

            // Map columns
            const locCols = {};
            let almoxCol = -1;
            let descarteCol = -1;
            let perdaCol = -1;
            let itemCol = 0;
            let catCol = 1;

            headers.forEach((h, colIdx) => {
              const upper = h.toUpperCase().trim();
              if (upper === 'ITEM' || upper === 'PRODUTO' || upper === 'NOME') {
                itemCol = colIdx;
                return;
              }
              if (upper === 'CATEGORIA' || upper === 'SETOR') {
                catCol = colIdx;
                return;
              }
              if (upper.includes('ALMOX')) {
                almoxCol = colIdx;
                return;
              }
              if (upper.includes('DESCART')) {
                descarteCol = colIdx;
                return;
              }
              if (upper.includes('PERDA') || upper.includes('EXTRAV')) {
                perdaCol = colIdx;
                return;
              }

              // Match with emUsoLocations
              emUsoLocations.forEach(loc => {
                const locUpper = loc.nome.toUpperCase().trim();
                if (upper === locUpper || upper.includes(locUpper) || locUpper.includes(upper)) {
                  locCols[loc.id] = colIdx;
                }
              });
            });

            // Parse items and saldos
            const parsedItemsList = [];
            const evaluatedSaldos = {};

            dataRows.forEach((r, rowIdx) => {
              const itemNome = String(r[itemCol] || '').trim();
              if (!itemNome || itemNome.toUpperCase().startsWith('TOTAL') || itemNome.toUpperCase().startsWith('OBS')) return;

              // Find matching item in system
              const match = currentItems.find(it => it.nome.toUpperCase().trim() === itemNome.toUpperCase().trim()) || {
                id: 'item_imp_' + rowIdx,
                nome: itemNome,
                categoria: String(r[catCol] || 'Geral').trim()
              };

              const saldos = {};
              let totalEmUso = 0;

              emUsoLocations.forEach(loc => {
                const col = locCols[loc.id];
                const rawVal = col !== undefined ? r[col] : 0;
                const v = evaluateMathExpression(rawVal);
                saldos[loc.id] = v;
                totalEmUso += v;
              });

              const almoxVal = almoxCol !== -1 ? evaluateMathExpression(r[almoxCol]) : 0;
              const descarteVal = descarteCol !== -1 ? evaluateMathExpression(r[descarteCol]) : 0;
              const perdaVal = perdaCol !== -1 ? evaluateMathExpression(r[perdaCol]) : 0;

              saldos.almoxarifado = almoxVal;
              saldos.descarte = descarteVal;
              saldos.perda = perdaVal;

              evaluatedSaldos[match.id] = saldos;

              parsedItemsList.push({
                id: match.id,
                nome: match.nome,
                categoria: match.categoria || '',
                saldos: saldos,
                totalEmUso: totalEmUso,
                almoxarifado: almoxVal,
                descarte: descarteVal,
                perda: perdaVal,
                totalGeral: totalEmUso + almoxVal
              });
            });

            if (parsedItemsList.length === 0) {
              alert('Não foi possível identificar itens válidos na planilha. Verifique o layout da tabela.');
              return;
            }

            // Extract date from filename if present (e.g. 2026-08-23 or 23-08-2026)
            let defaultDate = new Date().toISOString().split('T')[0];
            const dateMatch = file.name.match(/(\d{4}[-_]\d{2}[-_]\d{2})|(\d{2}[-_]\d{2}[-_]\d{4})/);
            if (dateMatch) {
              const rawDateStr = dateMatch[0].replace(/_/g, '-');
              if (rawDateStr.length === 10 && rawDateStr.startsWith('20')) {
                defaultDate = rawDateStr;
              }
            }

            setImportModalData({
              fileName: file.name,
              sheetName: sheetName,
              dataInventario: defaultDate,
              titulo: `Inventário Importado — ${new Date().toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}`,
              responsavel: 'Governança',
              parsedItems: parsedItemsList,
              evaluatedSaldos: evaluatedSaldos
            });

          } catch (err) {
            console.error(err);
            alert('Erro ao processar planilha Excel: ' + err.message);
          } finally {
            if (excelImportInputRef.current) {
              excelImportInputRef.current.value = '';
            }
          }
        };
        reader.readAsArrayBuffer(file);
      };

              row.push(almox);

              row.push(saldos.perda || 0);
              row.push(totalGeral);
              row.push(meta);

function InventarioTab({ ambiente, items, locations, inventarios, onTriggerImportExcel, onSaveInventario, onApplyInventarioToStock, onPrintFicha }) {
      const [dataInventario, setDataInventario] = useState(new Date().toISOString().split('T')[0]);
      const [titulo, setTitulo] = useState(`Contagem Geral — ${new Date().toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}`);
      const [responsavel, setResponsavel] = useState('Governança');
      const [contagem, setContagem] = useState({});

      useEffect(() => {
        const initial = {};
        items.forEach(it => {
          initial[it.id] = { ...(it.saldos || {}) };
        });
        setContagem(initial);
      }, [items]);

      const handleCountChange = (itemId, locId, val) => {
        setContagem(prev => ({
          ...prev,
          [itemId]: {
            ...(prev[itemId] || {}),
            [locId]: val
          }
        }));
      };

      const handleFinalizarInventario = () => {
        if (!dataInventario) {
          alert('Por favor, informe a Data em que a contagem física foi realizada.');
          return;
        }

        const dataFormatada = dataInventario.split('-').reverse().join('/');
        if (!confirm(`Confirmação de Finalização:

• Data da Contagem Física: ${dataFormatada} (${dataInventario})
• Título: ${titulo}
• Responsável: ${responsavel}

Deseja realmente finalizar e salvar esta auditoria no histórico e atualizar os saldos de estoque do sistema com os valores apurados?`)) {
          return;
        }

        const evaluatedSaldos = {};
        items.forEach(it => {
          evaluatedSaldos[it.id] = {};
          locations.forEach(loc => {
            const rawVal = contagem[it.id]?.[loc.id];
            evaluatedSaldos[it.id][loc.id] = evaluateMathExpression(rawVal);
          });
          evaluatedSaldos[it.id].almoxarifado = evaluateMathExpression(contagem[it.id]?.almoxarifado);
          evaluatedSaldos[it.id].descarte = evaluateMathExpression(contagem[it.id]?.descarte);
          evaluatedSaldos[it.id].perda = evaluateMathExpression(contagem[it.id]?.perda);
        });

        const newAudit = {
          id: 'inv_' + Date.now(),
          ambiente,
          titulo: titulo || `Inventário (${dataInventario})`,
          responsavel: responsavel || 'Governança',
          data: dataInventario,
          timestamp: new Date().toISOString(),
          itens: items.map(it => ({
            id: it.id,
            nome: it.nome,
            categoria: it.categoria || '',
            saldos: evaluatedSaldos[it.id] || {}
          })),
          contagem: evaluatedSaldos
        };

        onSaveInventario(newAudit);
        onApplyInventarioToStock(evaluatedSaldos);
      };

      return (
        <div className="bg-sombra-900 border border-sombra-800 p-6 rounded-2xl space-y-6 shadow-xl">
          
          <div className="flex flex-wrap items-center justify-between gap-4 border-b border-sombra-800 pb-4">
            <div>
              <h2 className="font-bold text-lg text-white flex items-center gap-2">
                <Icons.ClipboardCheck />
                <span>Nova Contagem Periódica de Estoque (Auditoria — {ambiente === "hotel" ? "Hotel & Resort" : "Floresta & SPA"})</span>
              </h2>
              <p className="text-xs text-sombra-400">
                Digite as quantidades apuradas na contagem física. Você pode digitar somas diretas (ex: <code className="text-brand-400">10+15+6</code>).
              </p>
            </div>

            <div className="flex items-center gap-2 flex-wrap">
              <button
                onClick={onTriggerImportExcel}
                className="flex items-center gap-1.5 px-3.5 py-2 bg-emerald-950/90 hover:bg-emerald-900 text-emerald-300 border border-emerald-700 rounded-xl text-xs font-bold transition shadow-sm"
                title="Importar contagem a partir de planilha Excel (.xlsx)"
              >
                <Icons.Upload />
                <span>Importar Planilha Excel (.xlsx)</span>
              </button>

              <button
                onClick={onPrintFicha}
                className="flex items-center gap-1.5 px-3 py-2 bg-sombra-800 hover:bg-sombra-700 text-slate-200 rounded-xl text-xs font-bold transition border border-sombra-700"
              >
                <Icons.Printer />
                <span>Imprimir Ficha em Branco</span>
              </button>

              <button
                onClick={handleFinalizarInventario}
                className="flex items-center gap-2 px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black rounded-xl text-xs transition shadow-lg shadow-emerald-600/20"
              >
                <Icons.Check />
                <span>Finalizar e Salvar Auditoria</span>
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-sombra-850 p-4 rounded-xl border border-sombra-700">
            <div>
              <label className="block text-[11px] font-bold text-slate-300 uppercase mb-1 flex items-center gap-1">
                <span>📅 Data da Contagem Física</span>
                <span className="text-rose-400">*</span>
              </label>
              <input
                type="date"
                value={dataInventario}
                onChange={(e) => setDataInventario(e.target.value)}
                required
                className="w-full px-3 py-2 bg-sombra-900 border border-sombra-700 rounded-lg text-xs text-white font-semibold focus:outline-none focus:border-brand-500"
              />
              <span className="text-[10px] text-sombra-400 mt-0.5 block">Data real em que foi feita a contagem nos quartos/setores</span>
            </div>

            <div>
              <label className="block text-[11px] font-bold text-slate-300 uppercase mb-1">Título do Inventário</label>
              <input
                type="text"
                value={titulo}
                onChange={(e) => setTitulo(e.target.value)}
                placeholder="Ex: Inventário Geral - Agosto 2026"
                className="w-full px-3 py-2 bg-sombra-900 border border-sombra-700 rounded-lg text-xs text-white font-semibold focus:outline-none focus:border-brand-500"
              />
              <span className="text-[10px] text-sombra-400 mt-0.5 block">Identificação para consulta no histórico</span>
            </div>

            <div>
              <label className="block text-[11px] font-bold text-slate-300 uppercase mb-1">Responsável pela Contagem</label>
              <input
                type="text"
                value={responsavel}
                onChange={(e) => setResponsavel(e.target.value)}
                placeholder="Nome do auditor / governança"
                className="w-full px-3 py-2 bg-sombra-900 border border-sombra-700 rounded-lg text-xs text-white font-semibold focus:outline-none focus:border-brand-500"
              />
              <span className="text-[10px] text-sombra-400 mt-0.5 block">Equipe ou pessoa que realizou a conferência</span>
            </div>
          </div>

          <div className="overflow-x-auto max-h-[600px] table-fixed-header">
            <table className="w-full text-left text-xs text-slate-200 border-collapse">
              <thead className="bg-sombra-950 text-sombra-400 font-bold uppercase tracking-wider text-[10px] border-b border-sombra-800">
                <tr>
                  <th className="py-3 px-4 sticky-col-first bg-sombra-950 min-w-[180px]">Item</th>
                  {locations.map(loc => (
                    <th key={loc.id} className="py-3 px-2 text-center min-w-[70px]">{loc.nome}</th>
                  ))}
                  <th className="py-3 px-2 text-center bg-cyan-950/40 text-cyan-300 min-w-[80px]">Almoxarifado</th>
                  <th className="py-3 px-2 text-center bg-emerald-950/40 text-emerald-300 min-w-[90px]">Total Físico</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-sombra-800 font-mono">
                {items.map(item => {
                  let totalFisico = 0;
                  locations.forEach(loc => {
                    const v = evaluateMathExpression(contagem[item.id]?.[loc.id]);
                    totalFisico += v;
                  });
                  totalFisico += evaluateMathExpression(contagem[item.id]?.almoxarifado);

                  return (
                    <tr key={item.id} className="hover:bg-sombra-850/60 transition">
                      <td className="py-2 px-4 font-sans font-bold text-white sticky-col-first bg-sombra-900 border-r border-sombra-800">
                        {item.nome}
                      </td>

                      {locations.map(loc => {
                        const rawVal = contagem[item.id]?.[loc.id] !== undefined ? contagem[item.id]?.[loc.id] : (item.saldos?.[loc.id] || '');
                        return (
                          <td key={loc.id} className="py-1 px-1 text-center border-l border-sombra-800/40">
                            <input
                              type="text"
                              value={rawVal}
                              onChange={(e) => handleCountChange(item.id, loc.id, e.target.value)}
                              placeholder="0"
                              className="w-14 text-center py-1 bg-sombra-950 border border-sombra-700 rounded font-mono text-xs text-brand-300 focus:outline-none focus:border-brand-500"
                            />
                          </td>
                        );
                      })}

                      <td className="py-1 px-1 text-center bg-cyan-950/20 border-l border-sombra-800">
                        <input
                          type="text"
                          value={contagem[item.id]?.almoxarifado !== undefined ? contagem[item.id]?.almoxarifado : (item.saldos?.almoxarifado || '')}
                          onChange={(e) => handleCountChange(item.id, 'almoxarifado', e.target.value)}
                          placeholder="0"
                          className="w-14 text-center py-1 bg-sombra-950 border border-cyan-500/50 rounded font-mono text-xs text-cyan-300 focus:outline-none"
                        />
                      </td>

                      <td className="py-2 px-2 text-center bg-emerald-950/30 text-brand-400 font-black text-sm border-l border-sombra-800">
                        {totalFisico}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary caught an error:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6">
              <div className="bg-slate-900 border border-rose-800 p-8 rounded-2xl max-w-lg w-full text-center space-y-4 shadow-2xl">
                <div className="w-16 h-16 bg-rose-500/10 text-rose-400 rounded-2xl flex items-center justify-center mx-auto text-2xl">
                  ⚠️
                </div>
                <h2 className="text-xl font-bold text-rose-300">Ocorreu um erro na renderização</h2>
                <p className="text-xs text-slate-400 font-mono bg-slate-950 p-3 rounded-lg border border-slate-800 text-left overflow-auto max-h-40">
                  {String(this.state.error && this.state.error.message)}
                </p>
                <button
                  onClick={() => window.location.reload()}
                  className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs transition"
                >
                  Recarregar Página
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>,
      document.getElementById('root')
    );
  </script>
