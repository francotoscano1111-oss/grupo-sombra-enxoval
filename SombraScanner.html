<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sombra Scanner - Portal de Ingestion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#111827',
                        card: '#1f2937',
                        accent: '#8b5cf6',
                        accentHover: '#7c3aed',
                        accentGoogle: '#10b981',
                        accentGoogleHover: '#059669',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #111827; color: #f3f4f6; }
        .dropzone { border: 2px dashed #4b5563; transition: all 0.2s; }
        .dropzone.dragover { border-color: #8b5cf6; background-color: rgba(139, 92, 246, 0.1); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; width: 20px; height: 20px; }
        input, select, textarea { background-color: #111827 !important; color: #f3f4f6 !important; }
        option { background-color: #1f2937; color: #f3f4f6; }
        #preview-wrapper {
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            cursor: zoom-in;
            position: relative;
        }
        #preview-wrapper.zoomed { cursor: grab; }
        #preview-wrapper.zoomed:active { cursor: grabbing; }
        #preview-img {
            transform-origin: center center;
            transition: transform 0.15s ease;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
            user-select: none;
            display: block;
        }
        .zoom-btn {
            background: rgba(55,65,81,0.9);
            border: 1px solid #4b5563;
            color: #f3f4f6;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .zoom-btn:hover { background: rgba(139,92,246,0.7); border-color: #8b5cf6; }
        #zoom-toolbar {
            display: none;
            gap: 6px;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
            background: rgba(17,24,39,0.85);
            border-top: 1px solid #374151;
        }
        #zoom-level { font-size: 12px; color: #9ca3af; min-width: 40px; text-align: center; }
    </style>
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;">

    <div style="width:100%;max-width:1280px;display:flex;flex-direction:row;gap:16px;background:#1f2937;border-radius:14px;box-shadow:0 25px 50px rgba(0,0,0,.5);padding:16px;border:1px solid #374151;">
        
        <!-- COLONNA PREVIEW -->
        <div style="width:55%;flex-shrink:0;display:flex;flex-direction:column;border:1px solid #374151;border-radius:10px;overflow:hidden;background:#111827;min-height:560px;">
            <div class="p-3 bg-gray-800 border-b border-gray-700 text-sm font-semibold text-gray-300 text-center">
                Visualização do Documento
            </div>

            <!-- Toolbar zoom — SOPRA la preview, sempre visibile -->
            <div id="zoom-toolbar" style="display:none;gap:6px;align-items:center;justify-content:center;padding:5px 10px;background:rgba(17,24,39,0.9);border-bottom:1px solid #374151;">
                <button class="zoom-btn" id="btn-zoom-out" title="Reduzir">➖</button>
                <span id="zoom-level">100%</span>
                <button class="zoom-btn" id="btn-zoom-in"  title="Ampliar">➕</button>
                <button class="zoom-btn" id="btn-zoom-reset" title="Resetar">🔄</button>
                <button class="zoom-btn" id="btn-fullscreen" title="Ver em tela cheia">⛶</button>
            </div>

            <!-- Area preview -->
            <div id="preview-container" class="flex-1 flex items-center justify-center text-gray-500 text-sm p-3" style="min-height:420px;">
                <span>Nenhum arquivo carregado</span>
            </div>
        </div>

        <!-- COLONNA FORM -->
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;">
            <div style="text-align:center;margin-bottom:10px;">
                <h1 style="font-size:1.3rem;font-weight:700;color:#fff;margin-bottom:2px;">📁 Sombra Scanner</h1>
                <p style="color:#94a3b8;font-size:12px;">Arraste uma foto/PDF, preencha os dados e salve para conciliação automática.</p>
            </div>

            <!-- DROP ZONE -->
            <div id="dropzone" class="dropzone" style="height:60px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:10px;color:#94a3b8;gap:8px;">
                <svg style="width:22px;height:22px;flex-shrink:0;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                </svg>
                <span id="file-label" style="font-size:13px;font-weight:500;">Clique ou arraste um arquivo (PDF/Img)</span>
                <input type="file" id="file-input" class="hidden" accept=".pdf,image/*">
            </div>

            <!-- FORM - sempre abilitato -->
            <form id="metadata-form" style="display:flex;flex-direction:column;gap:8px;">

                <!-- Pasta de Destino -->
                <div style="background:#0f172a;border:1px solid #334155;border-radius:8px;padding:7px 10px;">
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                        <div style="display:flex;align-items:center;gap:6px;min-width:0;">
                            <span style="font-size:15px;">📂</span>
                            <div style="min-width:0;">
                                <div style="font-size:9px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;">Pasta de Destino</div>
                                <div id="folder-name" style="font-size:11px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px;" title="Nenhuma pasta selecionada">Nenhuma pasta selecionada</div>
                            </div>
                        </div>
                        <button type="button" id="btn-choose-folder" style="flex-shrink:0;background:#1e293b;border:1px solid #475569;color:#e2e8f0;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;" title="Escolher pasta (Chrome/Edge)">
                            📁 Alterar
                        </button>
                    </div>
                    <div id="folder-status" style="font-size:9px;color:#10b981;margin-top:2px;display:none;">✅ Pasta memorizada — os arquivos serão salvos automaticamente.</div>
                </div>

                <!-- Empresa (campo singolo, persistente) -->
                <div>
                    <label style="display:block;font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;">Empresa do Grupo</label>
                    <select id="doc-empresa" required style="width:100%;border:1px solid #4b5563;border-radius:7px;padding:6px 10px;font-size:13px;background:#111827;color:#f3f4f6;outline:none;">
                        <option value="">-- Selecione a Empresa --</option>
                        <option value="Arco-Iris">Arco-Iris</option>
                        <option value="SAF-Hospedagem">SAF Hospedagem</option>
                        <option value="Goyanna">Goyanna</option>
                        <option value="JM-SCP">JM SCP</option>
                    </select>
                </div>

                <!-- Riga: Data + NF -->
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                    <div>
                        <label style="display:block;font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;">Data (Venc./Emissão)</label>
                        <input type="date" id="doc-data" required style="width:100%;border:1px solid #4b5563;border-radius:7px;padding:6px 8px;font-size:13px;background:#111827;color:#f3f4f6;outline:none;box-sizing:border-box;">
                    </div>
                    <div>
                        <label style="display:block;font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;">Nº Nota Fiscal <span style="color:#64748b;font-weight:400;">(opt.)</span></label>
                        <input type="text" id="doc-nf" placeholder="Ex. 000055188" style="width:100%;border:1px solid #4b5563;border-radius:7px;padding:6px 8px;font-size:13px;background:#111827;color:#f3f4f6;outline:none;font-family:monospace;box-sizing:border-box;">
                    </div>
                </div>

                <!-- Riga: Valor -->
                <div>
                    <label style="display:block;font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;">Valor (R$)</label>
                    <input type="number" step="0.01" id="doc-importo" placeholder="Ex. 150.50" required style="width:100%;border:1px solid #4b5563;border-radius:7px;padding:6px 10px;font-size:13px;background:#111827;color:#f3f4f6;outline:none;font-family:monospace;">
                </div>

                <!-- Fornecedor -->
                <div>
                    <label style="display:block;font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;">Fornecedor / Descrição</label>
                    <input type="text" id="doc-fornitore" list="fornecedores-list" placeholder="Ex. Enel Energia" required style="width:100%;border:1px solid #4b5563;border-radius:7px;padding:6px 10px;font-size:13px;background:#111827;color:#f3f4f6;outline:none;">
                    <datalist id="fornecedores-list"></datalist>
                </div>

                <!-- Bottons -->
                <div style="display:flex;flex-direction:column;gap:7px;padding-top:4px;">
                    <button type="button" id="btn-drive" title="Requer Chrome ou Edge" style="width:100%;background:#059669;color:#fff;font-weight:700;padding:10px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;">
                        <svg style="width:18px;height:18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/>
                        </svg>
                        Salvar no Google Drive
                    </button>
                    <button type="submit" style="width:100%;background:#7c3aed;color:#fff;font-weight:700;padding:10px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;">
                        <svg style="width:18px;height:18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                        </svg>
                        Baixar Arquivo Formatado
                    </button>
                </div>
            </form>

            <div id="success-msg" class="hidden mt-4 p-3 bg-green-900 border border-green-500 rounded-lg text-green-300 text-sm text-center break-all"></div>
            <div id="error-msg" class="hidden mt-4 p-3 bg-red-900 border border-red-500 rounded-lg text-red-300 text-sm text-center"></div>
        </div>

    </div>

            // Custom list (inseriti dall'utente, ordinati)
            customFornecedores.slice().sort().forEach(function(forn) {
                var opt = document.createElement('option');
                opt.value = '⭐ ' + forn;   // prefisso per distinguerli visivamente
                opt.setAttribute('data-custom', '1');
                dataList.appendChild(opt);
            });
        }
        rebuildDatalist();

        // Tenta di aggiungere un fornitore custom (chiamato al salvataggio)
        function tryAddCustomFornecedor(value) {
            if (!value) return;
            var upper = value.toUpperCase();
            // Già nella lista base o già custom?
            if (fornecedoresSet.has(upper)) return;
            if (customFornecedores.some(function(f) { return f.toUpperCase() === upper; })) return;
            // Nuovo → salva e aggiorna datalist
            customFornecedores.push(value.trim());
            localStorage.setItem('sombra-scanner-fornecedores', JSON.stringify(customFornecedores));
            rebuildDatalist();
        }

        // ── Refs ────────────────────────────────────────────────────────────────
        var dropzone         = document.getElementById('dropzone');
        var fileInput        = document.getElementById('file-input');
        var fileLabel        = document.getElementById('file-label');
        var form             = document.getElementById('metadata-form');
        var dataInput        = document.getElementById('doc-data');
        var successMsg       = document.getElementById('success-msg');
        var errorMsg         = document.getElementById('error-msg');
        var btnDrive         = document.getElementById('btn-drive');
        var btnChooseFolder  = document.getElementById('btn-choose-folder');
        var folderNameEl     = document.getElementById('folder-name');
        var folderStatusEl   = document.getElementById('folder-status');
        var previewContainer = document.getElementById('preview-container');

        var currentFile          = null;
        var driveDirectoryHandle = null;

        // Nascondi tutto il widget cartella se API non supportata
        if (!window.showDirectoryPicker) {
            document.getElementById('btn-choose-folder').closest('div[style]').style.display = 'none';
            btnDrive.style.display = 'none';
        }

        // Data di default = oggi
        dataInput.valueAsDate = new Date();

        // ── IndexedDB per persistere la cartella ────────────────────────────────
        var idb = null;
        function openIDB() {
            return new Promise(function(resolve, reject) {
                var req = indexedDB.open('sombra-scanner', 1);
                req.onupgradeneeded = function(e) {
                    e.target.result.createObjectStore('config');
                };
                req.onsuccess = function(e) { resolve(e.target.result); };
                req.onerror   = function()  { resolve(null); }; // non blocchiamo su errore IDB
            });
        }
        function idbPut(key, value) {
            if (!idb) return;
            try { idb.transaction('config', 'readwrite').objectStore('config').put(value, key); } catch(e) {}
        }
        function idbGet(key) {
            return new Promise(function(resolve) {
                if (!idb) { resolve(null); return; }
                try {
                    var req = idb.transaction('config', 'readonly').objectStore('config').get(key);
                    req.onsuccess = function() { resolve(req.result || null); };
                    req.onerror   = function() { resolve(null); };
                } catch(e) { resolve(null); }
            });
        }

        function setFolderUI(name) {
            folderNameEl.textContent = name || 'Nenhuma pasta selecionada';
            folderNameEl.title       = name || 'Nenhuma pasta selecionada';
            folderStatusEl.style.display = name ? 'block' : 'none';
            // Aggiorna etichetta bottone Drive
            btnDrive.childNodes[btnDrive.childNodes.length - 1].textContent =
                name ? ' Salvar em "' + name + '"' : ' Salvar no Google Drive';
        }

        // Ripristino cartella da IDB all'avvio
        openIDB().then(function(db) {
            idb = db;
            return idbGet('folderHandle');
        }).then(async function(handle) {
            if (!handle || !window.showDirectoryPicker) return;
            try {
                // Richiede il permesso in modo silenzioso (no gesto utente necessario in Chrome 122+)
                var perm = await handle.queryPermission({ mode: 'readwrite' });
                if (perm === 'granted') {
                    driveDirectoryHandle = handle;
                    setFolderUI(handle.name);
                } else {
                    // Se non hai il permesso, lo chiediamo al prossimo click
                    folderNameEl.textContent = handle.name + ' (clique para reautorizar)';
                    folderNameEl.style.color = '#f59e0b';
                    // Salviamo il handle in attesa del gesto utente
                    driveDirectoryHandle = handle;
                }
            } catch(e) {
                // handle scaduto o incompatibile, ignoriamo
            }
        });

        // ── Preview ─────────────────────────────────────────────────────────────
        var currentScale  = 1;
        var currentFileUrl = null;
        var zoomToolbar   = document.getElementById('zoom-toolbar');
        var zoomLevelEl   = document.getElementById('zoom-level');
        var previewImg    = null;    // ref immagine corrente
        var previewIframe = null;   // ref iframe PDF corrente

        function updateZoomLabel() {
            zoomLevelEl.textContent = Math.round(currentScale * 100) + '%';
        }

        function applyZoom(scale) {
            currentScale = Math.min(Math.max(scale, 0.25), 8);

            if (previewImg) {
                // Immagini: CSS transform (immediato e fluido)
                previewImg.style.transform = 'scale(' + currentScale + ')';
                previewImg.parentElement.classList.toggle('zoomed', currentScale > 1);
            }

            if (previewIframe && currentFileUrl) {
                // PDF: Chrome ignora i cambi di hash su iframe già caricato.
                // Forza il ricaricamento passando per about:blank, poi ripristina con il nuovo zoom.
                var zoomPct   = Math.round(currentScale * 100);
                var targetSrc = currentFileUrl + '#toolbar=1&zoom=' + zoomPct;
                previewIframe.src = 'about:blank';
                setTimeout(function() { previewIframe.src = targetSrc; }, 30);
            }

            updateZoomLabel();
        }

        function showPreview(file) {
            previewContainer.innerHTML = '';
            currentScale  = 1;
            previewImg    = null;
            previewIframe = null;
            if (currentFileUrl) URL.revokeObjectURL(currentFileUrl);
            currentFileUrl = URL.createObjectURL(file);

            if (file.type.startsWith('image/')) {
                // Wrapper scrollabile
                var wrapper = document.createElement('div');
                wrapper.id  = 'preview-wrapper';
                wrapper.style.cssText = 'width:100%;height:100%;min-height:380px;overflow:hidden;display:flex;align-items:center;justify-content:center;';

                var img = document.createElement('img');
                img.id  = 'preview-img';
                img.src = currentFileUrl;
                img.style.cssText = 'transform-origin:center center;transition:transform 0.15s ease;max-width:100%;max-height:380px;object-fit:contain;border-radius:4px;user-select:none;display:block;';
                previewImg = img;

                // Click alterna zoom 1x ↔ 2.5x
                img.addEventListener('click', function() {
                    applyZoom(currentScale > 1 ? 1 : 2.5);
                });

                // Scroll wheel zoom
                wrapper.addEventListener('wheel', function(e) {
                    e.preventDefault();
                    var delta = e.deltaY < 0 ? 0.15 : -0.15;
                    applyZoom(currentScale + delta);
                }, { passive: false });

                wrapper.appendChild(img);
                previewContainer.appendChild(wrapper);
                updateZoomLabel();

            } else if (file.type === 'application/pdf') {
                var iframe = document.createElement('iframe');
                iframe.src = currentFileUrl + '#toolbar=1&zoom=100';
                iframe.style.cssText = 'width:100%;height:430px;border:0;border-radius:6px;';
                previewIframe = iframe;   // <-- salvo il riferimento per il zoom
                previewContainer.appendChild(iframe);

            } else {
                previewContainer.innerHTML = '<span style="color:#f59e0b;">Pré-visualização não disponível para este formato.</span>';
            }

            zoomToolbar.style.display = 'flex';
        }

        // Bottoni toolbar zoom
        document.getElementById('btn-zoom-in').addEventListener('click', function()    { applyZoom(currentScale + 0.25); });
        document.getElementById('btn-zoom-out').addEventListener('click', function()   { applyZoom(currentScale - 0.25); });
        document.getElementById('btn-zoom-reset').addEventListener('click', function() { applyZoom(1); });
        document.getElementById('btn-fullscreen').addEventListener('click', function() {
            if (currentFileUrl) window.open(currentFileUrl, '_blank');
        });

        // ── handleFile ──────────────────────────────────────────────────────────
        function handleFile(file) {
            if (!file) return;
            currentFile = file;
            fileLabel.textContent = '✅ ' + file.name;
            fileLabel.style.color = '#a78bfa';
            successMsg.classList.add('hidden');
            errorMsg.classList.add('hidden');

            // Reset campi ad ogni nuovo file — solo Empresa è persistente
            dataInput.valueAsDate = new Date();
            document.getElementById('doc-importo').value = '';
            document.getElementById('doc-nf').value = '';
            document.getElementById('doc-fornitore').value = '';

            showPreview(file);
        }

        // ── Drag & Drop / Click ─────────────────────────────────────────────────
        dropzone.addEventListener('click', function() { fileInput.click(); });
        fileInput.addEventListener('change', function(e) { handleFile(e.target.files[0]); });

        dropzone.addEventListener('dragover', function(e) {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });
        dropzone.addEventListener('dragleave', function() {
            dropzone.classList.remove('dragover');
        });
        dropzone.addEventListener('drop', function(e) {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });

        // ── Genera il nome file ─────────────────────────────────────────────────
        function cleanForn(raw) {
            // Rimuove il prefisso '⭐ ' dai fornitori custom prima di usarlo nel filename
            return (raw || '').replace(/^⭐\s*/, '').trim();
        }
        function getNewFileName() {
            var d    = dataInput.value;
            var a    = document.getElementById('doc-importo').value.replace(',', '.');
            var nfRaw = document.getElementById('doc-nf').value.trim().replace(/[^a-zA-Z0-9]/g, '');
            var nf   = nfRaw ? 'NF' + nfRaw : '';
            var forn = cleanForn(document.getElementById('doc-fornitore').value).replace(/[^a-zA-Z0-9 -]/g, '').replace(/\s+/g, '-');
            var emp  = document.getElementById('doc-empresa').value;
            var ext  = currentFile ? currentFile.name.split('.').pop() : 'pdf';
            var id   = Math.random().toString(36).substring(2, 6).toUpperCase();
            var parts = ['SCAN', d, a];
            if (nf) parts.push(nf);
            parts.push(forn, emp, id);
            return parts.join('_') + '.' + ext;
        }

        // Estrae la firma senza l'ID casuale
        function getFileSignature() {
            var d    = dataInput.value;
            var a    = document.getElementById('doc-importo').value.replace(',', '.');
            var nfRaw = document.getElementById('doc-nf').value.trim().replace(/[^a-zA-Z0-9]/g, '');
            var nf   = nfRaw ? 'NF' + nfRaw : '';
            var forn = cleanForn(document.getElementById('doc-fornitore').value).replace(/[^a-zA-Z0-9 -]/g, '').replace(/\s+/g, '-');
            var emp  = document.getElementById('doc-empresa').value;
            var parts = ['SCAN', d, a];
            if (nf) parts.push(nf);
            parts.push(forn, emp);
            return parts.join('_');
        }

        // Cerca duplicati nella cartella GDrive (ritorna il nome del file trovato o null)
        async function checkDuplicateInFolder(dirHandle, signature) {
            try {
                for await (var entry of dirHandle.entries()) {
                    var name   = entry[0];
                    var kind   = entry[1].kind;
                    if (kind === 'file' && name.startsWith(signature)) {
                        return name; // trovato duplicato
                    }
                }
            } catch(e) { /* ignora errori di permesso */ }
            return null;
        }

        function showSuccess(msg) {
            successMsg.textContent = msg;
            successMsg.classList.remove('hidden');
            errorMsg.classList.add('hidden');
        }
        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
            successMsg.classList.add('hidden');
        }

        // ── Scelta cartella (pulsante Alterar) ─────────────────────────────────
        btnChooseFolder.addEventListener('click', async function() {
            if (!window.showDirectoryPicker) {
                showError('⚠️ Seu navegador não suporta seleção de pasta. Use Chrome ou Edge.');
                return;
            }
            try {
                var handle = await window.showDirectoryPicker({ mode: 'readwrite', startIn: 'desktop' });
                driveDirectoryHandle = handle;
                idbPut('folderHandle', handle);
                setFolderUI(handle.name);
                folderNameEl.style.color = '#94a3b8';
                showSuccess('📂 Pasta "' + handle.name + '" selecionada e memorizada!');
            } catch(err) {
                if (err.name !== 'AbortError') showError('❌ Erro ao selecionar pasta: ' + err.message);
            }
        });

        // ── Salva in Cartella memorizzata ───────────────────────────────────────
        btnDrive.addEventListener('click', async function() {
            if (!currentFile) { showError('⚠️ Carregue um arquivo primeiro.'); return; }
            if (!form.checkValidity()) { form.reportValidity(); return; }

            // Se non abbiamo ancora una cartella, apriamo il picker
            if (!driveDirectoryHandle) {
                try {
                    driveDirectoryHandle = await window.showDirectoryPicker({ mode: 'readwrite', startIn: 'desktop' });
                    idbPut('folderHandle', driveDirectoryHandle);
                    setFolderUI(driveDirectoryHandle.name);
                } catch(err) {
                    if (err.name !== 'AbortError') showError('❌ Nenhuma pasta selecionada. Escolha uma pasta primeiro.');
                    return;
                }
            }

            // Richiede permesso se necessario (es. dopo reload)
            try {
                var perm = await driveDirectoryHandle.queryPermission({ mode: 'readwrite' });
                if (perm !== 'granted') {
                    perm = await driveDirectoryHandle.requestPermission({ mode: 'readwrite' });
                }
                if (perm !== 'granted') {
                    showError('❌ Permissão negada para a pasta. Escolha outra.');
                    return;
                }
            } catch(e) {
                // API não supporta queryPermission in alcuni browser — proviamo comunque
            }

            // ── Controlo duplicati ───────────────────────────────────────────────
            var sig = getFileSignature();
            var existing = await checkDuplicateInFolder(driveDirectoryHandle, sig);
            if (existing) {
                var ok = window.confirm(
                    '⚠️ DUPLICADO DETECTADO\n\n' +
                    'Já existe um arquivo com os mesmos dados na pasta:\n"' + existing + '"\n\n' +
                    'Deseja salvar mesmo assim?'
                );
                if (!ok) {
                    showError('🚫 Salvamento cancelado. Arquivo duplicado: ' + existing);
                    return;
                }
            }

            try {
                var newName  = getNewFileName();
                var fHandle  = await driveDirectoryHandle.getFileHandle(newName, { create: true });
                var writable = await fHandle.createWritable();
                await writable.write(currentFile);
                await writable.close();
                // Memorizza il fornitore se nuovo
                tryAddCustomFornecedor(document.getElementById('doc-fornitore').value.trim());
                showSuccess('✅ Salvo em "' + driveDirectoryHandle.name + '" como: ' + newName);
            } catch (err) {
                showError('❌ Erro ao salvar: ' + err.message);
            }
        });

        // ── Baixar Arquivo ──────────────────────────────────────────────────────
        // Per il download classico uso sessionStorage per tracciare le firme salvate
        var downloadedSigs = new Set(
            JSON.parse(sessionStorage.getItem('sombra-scanner-sigs') || '[]')
        );

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (!currentFile) { showError('⚠️ Carregue um arquivo primeiro.'); return; }

            // Controlo duplicati (per download, tracciamo in sessionStorage)
            var sig = getFileSignature();
            if (downloadedSigs.has(sig)) {
                var ok = window.confirm(
                    '⚠️ DUPLICADO DETECTADO\n\n' +
                    'Já foi baixado um arquivo com os mesmos dados nesta sessão:\n"' + sig + '"\n\n' +
                    'Deseja baixar mesmo assim?'
                );
                if (!ok) {
                    showError('🚫 Download cancelado. Arquivo duplicado detectado.');
                    return;
                }
            }

            var newName = getNewFileName();
            var url     = URL.createObjectURL(currentFile);
            var a       = document.createElement('a');
            a.href      = url;
            a.download  = newName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function() { URL.revokeObjectURL(url); }, 1000);

            // Memorizza fornitore se nuovo + firma per deduplication
            tryAddCustomFornecedor(cleanForn(document.getElementById('doc-fornitore').value));
            downloadedSigs.add(sig);
            sessionStorage.setItem('sombra-scanner-sigs', JSON.stringify(Array.from(downloadedSigs)));

            showSuccess('⬇️ Baixado como: ' + newName + ' — Mova-o para a pasta do Google Drive!');
        });
    </script>
</body>
</html>
